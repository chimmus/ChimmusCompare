[project]
name = "ChimmusCompare"
version = "0.1.4"
description = "Compare stocks"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "dotenv>=0.9.9",
    "plotext<5.0",
    "requests>=2.34.2",
]

[project.scripts]
chimmuscompare = "chimmuscompare:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
